<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* Кнопки управления поверх экрана AR */
      .nav-btn {
        position: fixed;
        bottom: 30px;
        z-index: 999;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 2px solid #ffffff;
        border-radius: 25px;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        backdrop-filter: blur(5px);
        user-select: none;
      }
      #prevBtn { left: 20px; }
      #nextBtn { right: 20px; }
      
      /* Индикатор текущего видео */
      #videoCounter {
        position: fixed;
        bottom: 38px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        color: white;
        font-family: sans-serif;
        font-size: 16px;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(0,0,0,0.8);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Интерфейс поверх камеры -->
    <button id="prevBtn" class="nav-btn">◀ Назад</button>
    <div id="videoCounter">1 / 4</div>
    <button id="nextBtn" class="nav-btn">Вперед ▶</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" src="./video1.mp4" webkit-playsinline playsinline loop preload="auto"></video>
        <video id="vid2" src="./video2.mp4" webkit-playsinline playsinline loop preload="auto"></video>
        <video id="vid3" src="./video3.mp4" webkit-playsinline playsinline loop preload="auto"></video>
        <video id="vid4" src="./video4.mp4" webkit-playsinline playsinline loop preload="auto"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <!-- Позиция и масштаб видео плоскости -->
        <a-video id="arVideo" src="#vid1" position="0 0 0" height="0.5625" width="1" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const videos = ['#vid1', '#vid2', '#vid3', '#vid4'];
      let currentIndex = 0;

      const arVideo = document.querySelector('#arVideo');
      const prevBtn = document.querySelector('#prevBtn');
      const nextBtn = document.querySelector('#nextBtn');
      const counter = document.querySelector('#videoCounter');
      const target = document.querySelector('#target');

      function updateVideo(index) {
        // Останавливаем предыдущие видео
        videos.forEach(id => {
          const v = document.querySelector(id);
          if (v) v.pause();
        });

        // Переключаем источника на новый ролик
        arVideo.setAttribute('src', videos[index]);
        counter.textContent = `${index + 1} / ${videos.length}`;

        // Запускаем новое видео, если маркер виден
        const activeVideo = document.querySelector(videos[index]);
        if (activeVideo) {
          activeVideo.currentTime = 0;
          activeVideo.play().catch(e => console.log('Autoplay blocked:', e));
        }
      }

      // События нажатия на кнопки
      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentIndex = (currentIndex - 1 + videos.length) % videos.length;
        updateVideo(currentIndex);
      });

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentIndex = (currentIndex + 1) % videos.length;
        updateVideo(currentIndex);
      });

      // Воспроизведение только когда маркер в кадре
      target.addEventListener('targetFound', () => {
        const activeVideo = document.querySelector(videos[currentIndex]);
        if (activeVideo) activeVideo.play();
      });

      target.addEventListener('targetLost', () => {
        videos.forEach(id => {
          const v = document.querySelector(id);
          if (v) v.pause();
        });
      });
    </script>
  </body>
</html>
