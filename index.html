<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <title>Научный проект: Интерактивный Экодук в AR</title>
    <!-- Подключаем 3D-движок A-Frame и библиотеку MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* Оформление кнопок переключения сценариев */
      .ui-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 8px;
        width: 90%;
        max-width: 400px;
        justify-content: center;
      }
      .ar-btn {
        flex: 1;
        background: rgba(15, 23, 42, 0.85);
        color: #ffffff;
        border: 1.5px solid #22c55e;
        padding: 10px 8px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        font-family: system-ui, -apple-system, sans-serif;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: all 0.2s ease;
        text-align: center;
      }
      .ar-btn.active {
        background: #22c55e;
        color: #0f172a;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Интерфейс кнопок выбора сценария -->
    <div class="ui-container">
      <button class="ar-btn active" id="btn1" onclick="selectVideo('./video1.mp4', 'btn1')">1. Без моста</button>
      <button class="ar-btn" id="btn2" onclick="selectVideo('./video2.mp4', 'btn2')">2. С экодуком</button>
      <button class="ar-btn" id="btn3" onclick="selectVideo('./video3.mp4', 'btn3')">3. Вид сверху</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Исходное видео (по умолчанию запускается первое) -->
        <video id="arVideo" src="./video1.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Привязка к маркеру -->
      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <!-- Плоскость с проекцией видео роликов -->
        <a-video src="#arVideo" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const target = document.querySelector('#target');
      const video = document.querySelector('#arVideo');

      // Воспроизведение при обнаружении маркера и пауза при потере из кадра
      target.addEventListener("targetFound", () => {
        video.play();
      });
      target.addEventListener("targetLost", () => {
        video.pause();
      });

      // Переключение ролика при нажатии на кнопки
      function selectVideo(src, btnId) {
        video.pause();
        video.setAttribute('src', src);
        video.load();
        
        // Подсвечиваем активную кнопку
        document.querySelectorAll('.ar-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');

        video.play();
      }
    </script>
  </body>
</html>
